# dsh-models-import composition layer.
#
# The insert mounts the host half: the /plugins/models-import HTTP route the
# capability-aware "fetch available models" action interrogates. The browser
# half is discovered through this package's `dsh.client` declaration once the
# entry is enabled; it registers a "Models Pro" settings section beside the
# stock Models page, which stays untouched.
- insert:
    - id: models-import
      name: dsh-models-import
